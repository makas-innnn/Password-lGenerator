name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet CLI
        run: pip install flet

      - name: Build APK with Flet
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.10"
          bundled-python-version: "3.10"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flet-apk
          path: build/apk/*.apk
